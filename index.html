<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>smolstinkyprincess ♡</title>
  <style>
    :root {
      --bg: #FEE8F0;
      --card-bg: #FFF9FB;
      --border: #EADDF8;
      --text: #381D3F;
      --text-muted: #7D5286;
      --accent-pink: #F2A7BF;
      --accent-lavender: #D5CEF3;
      --accent-mint: #B7F4D8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    /* Floating Clouds Header/Footer */
    .clouds-decor {
      font-size: 1.4rem;
      letter-spacing: 0.3rem;
      color: var(--accent-lavender);
      margin-bottom: 0.5rem;
      user-select: none;
    }

    .profile-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 26px;
      padding: 2.2rem 1.8rem;
      box-shadow: 0 10px 28px rgba(229, 212, 247, 0.45);
      position: relative;
    }

    .bow-badge {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-pink);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.25rem 0.9rem;
      border-radius: 999px;
      border: 1px solid #FFF;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      white-space: nowrap;
    }

    .avatar {
      width: 76px;
      height: 76px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 50%;
      margin: 0.75rem auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      letter-spacing: -0.3px;
    }

    .bio {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .links-stack {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFF;
      border: 1.5px solid var(--border);
      padding: 0.85rem 1.25rem;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.15s ease-in-out;
    }

    .link-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-pink);
      box-shadow: 0 4px 12px rgba(242, 167, 191, 0.35);
      background: #FFF5F8;
    }

    .link-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.1rem;
    }

    .link-sub {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    .arrow {
      color: var(--accent-pink);
      font-weight: bold;
    }

    footer {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="clouds-decor">☁ ☁ ☁</div>

    <div class="profile-card">
      <div class="bow-badge">🎀 welcome 🎀</div>

      <div class="avatar"><img src="https://avatars.githubusercontent.com/u/340061454?v=4" /></div>
      <h1>smolstinkyprincess ♡</h1>
      <p class="bio">Building niche software, digital experiments, and cute pastel interfaces.</p>

      <div class="links-stack">
        <!-- Mochibun Project Link -->
        <a class="link-card" href="https://smolstinkyprincess.github.io/Mochibun/">
          <div class="link-meta">
            <span>Mochibun (もちぶん) ♡</span>
            <span class="link-sub">Pastel themed keypad-oriented launcher for the ALT Mive Style Folder (AT-M120)</span>
          </div>
          <span class="arrow">♡ →</span>
        </a>

        <!-- GitHub Profile -->
        <a class="link-card" href="https://github.com/smolstinkyprincess" target="_blank" rel="noopener">
          <div class="link-meta">
            <span>GitHub Profile</span>
            <span class="link-sub">Repositories & source code</span>
          </div>
          <span class="arrow">→</span>
        </a>
      </div>
    </div>

    <footer>
      made with ♡ & pastel magic
    </footer>
  </div>

</body>
</html>
